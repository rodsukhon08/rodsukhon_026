<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROSE Cafe</title>
    <!-- นำเข้าฟอนต์ไทย Mali จาก Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mali:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;1,200;1,300;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet">
    
    <!-- กำหนดให้ทุกส่วนบนหน้าเว็บใช้ฟอนต์ Mali -->
    <style>
        body, table, tr, td, h3, p, font {
            font-family: 'Mali', cursive, sans-serif;
        }
    </style>
</head>

<body bgcolor="#cdd1c7">
    <table border="1" bordercolor="#ffffff" align="center">
        <!-- แถวที่ 1: แบนเนอร์หลัก (อยู่ในตารางหลัก ทำให้กว้างพอดีกับกรอบด้านล่าง) -->
        <tr>
            <td colspan="4" style="padding: 0;">
                <img src="images/Banner.jpg" width="100%" height="500" alt="ROSE Cafe Banner" style="display: block;">
            </td>
        </tr>
        
        <!-- แถวที่ 2: ปุ่มเมนูเนวิเกชัน (4 ปุ่ม) -->
        <tr height="70" align="center">
            <td><a href="index3.html"><img src="images/1.png" height="100" alt="เมนูเครื่องดื่ม"></a></td>
            <td><a href="index4.html"><img src="images/2.png" height="100" alt="เมนูอาหาร"></a></td>
            <td><a href="index5.html"><img src="images/3.png" height="100" alt="เวลาเปิดปิด"></a></td>
            <td><a href="index.html"><img src="images/4.png" height="100" alt="ติดต่อ"></a></td>
        </tr>
        
        <!-- แถวที่ 3: ตารางเนื้อหาภายใน (แสดงรูป aohad และ ee โดยเอาพื้นหลังสีขาวออก) -->
        <tr>
            <td colspan="4">
                <table border="0" align="center" width="90%" cellpadding="10" cellspacing="10">
                    <tr valign="top">
                        <!-- บล็อกรูปที่ 1: รูป aohad (ไม่มีกรอบขาว) -->
                        <td width="50%" align="center" style="padding: 15px;">
                            <img src="images/aohad.jpg" width="500" height="300" style="object-fit: cover;" alt="aohad">
                        </td>

                        <!-- บล็อกรูปที่ 2: รูป ee (ไม่มีกรอบขาว) -->
                        <td width="50%" align="center" style="padding: 15px;">
                            <img src="images/ee.jpg" width="500" height="300" style="object-fit: cover;" alt="ee">
                        </td>
                    </tr>
                </table>
            </td>
        </tr>

        <!-- แถวที่ 4: ส่วนท้าย (Footer) -->
        <tr>
            <td colspan="4" align="center">
                <font color="#333333">เว็บไซต์นี้เป็นส่วนหนึ่งของ นางสาว รสสุคนธ์ พุ่มเกษม พท.3/1 026</font>
            </td>
        </tr>
    </table>

</html>
